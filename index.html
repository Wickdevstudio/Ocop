                    { category: "โมดูลเสริมและระบบพลังงาน", name: "โมดูลเวลาจริง (DS3231 RTC Module)", price: 105 },
                    { category: "โมดูลเสริมและระบบพลังงาน", name: "โมดูลอ่านการ์ด Micro SD Card (Data Logger)", price: 40 },
                    { category: "อุปกรณ์ต่อวงจรและต่อวงจร", name: "บอร์ดทดลอง (Solderless Breadboard)", price: 40 },
                    { category: "อุปกรณ์ต่อวงจรและต่อวงจร", name: "สายจัมเปอร์/สายแพสำหรับต่อวงจร (คละหัว ผู้-ผู้ / ผู้-เมีย)", price: 120 }
                ]
            },
            {
                id: 10,
                title: "โปรเจก ระบบแจ้งเตือนอากาศร้อน",
                totalPrice: 570,
                icon: "fa-temperature-high",
                iconColor: "text-orange-400",
                iconBg: "bg-orange-500/10",
                items: [
                    { category: "บอร์ดควบคุมหลัก", name: "Arduino UNO R3 พร้อมสาย USB", price: 300 },
                    { category: "เซ็นเซอร์", name: "เซนเซอร์วัดอุณหภูมิและความชื้นรุ่นเริ่มต้น (DHT11)", price: 35 },
                    { category: "อุปกรณ์ควบคุมและoutput", name: "พัดลมระบายความร้อน DC ขนาดเล็ก", price: 40 },
                    { category: "อุปกรณ์แจ้งเตือนและแสดงผล", name: "บัซเซอร์ส่งเสียงเตือน (Active Buzzer)", price: 35 },
                    { category: "อุปกรณ์ต่อวงจรและต่อวงจร", name: "บอร์ดทดลอง (Solderless Breadboard)", price: 40 },
                    { category: "อุปกรณ์ต่อวงจรและต่อวงจร", name: "สายจัมเปอร์/สายแพสำหรับต่อวงจร (คละหัว ผู้-ผู้ / ผู้-เมีย)", price: 120 }
                ]
            }
        ];

        // Helper function for category badge styling
        function getCategoryBadge(cat) {
            let color = "bg-gray-800 text-gray-300 border-gray-700";
            if (cat.includes("บอร์ดควบคุม")) color = "bg-cyan-950/60 text-cyan-300 border-cyan-800/50";
            else if (cat.includes("เซ็นเซอร์")) color = "bg-emerald-950/60 text-emerald-300 border-emerald-800/50";
            else if (cat.includes("ควบคุมและoutput")) color = "bg-purple-950/60 text-purple-300 border-purple-800/50";
            else if (cat.includes("แจ้งเตือนและแสดงผล")) color = "bg-pink-950/60 text-pink-300 border-pink-800/50";
            else if (cat.includes("ต่อวงจร")) color = "bg-amber-950/60 text-amber-300 border-amber-800/50";
            else if (cat.includes("โมดูลเสริม")) color = "bg-indigo-950/60 text-indigo-300 border-indigo-800/50";

            return `<span class="inline-block text-[10px] px-2 py-0.5 rounded-md border ${color} font-normal mb-1">${cat}</span>`;
        }

        // Initialize Filter Options
        function initFilterOptions() {
            const filterSelect = document.getElementById('project-filter');
            projectsData.forEach(p => {
                const opt = document.createElement('option');
                opt.value = p.id;
                opt.textContent = `📌 ${p.title}`;
                filterSelect.appendChild(opt);
            });
        }

        // Render Cards
        function renderDashboard(projects) {
            const grid = document.getElementById('projects-grid');
            const emptyState = document.getElementById('empty-state');
            grid.innerHTML = '';

            if (projects.length === 0) {
                grid.classList.add('hidden');
                emptyState.classList.remove('hidden');
                updateStats(0, 0, 0);
                return;
            }

            grid.classList.remove('hidden');
            emptyState.classList.add('hidden');

            let totalItemsCount = 0;
            let totalGrandCost = 0;

            projects.forEach(project => {
                totalGrandCost += project.totalPrice;
                totalItemsCount += project.items.length;

                // Create Project Card
                const card = document.createElement('div');
                card.className = "glass-card rounded-3xl p-5 flex flex-col justify-between transition-all duration-300 hover:-translate-y-1.5 shadow-card-glow group";

                let itemsHTML = project.items.map((item, idx) => `
                    <div class="py-2.5 ${idx !== project.items.length - 1 ? 'border-b border-gray-800/60' : ''} flex items-start justify-between gap-3 text-xs">
                        <div class="pr-2">
                            ${getCategoryBadge(item.category)}
                            <div class="text-gray-200 font-medium leading-relaxed group-hover:text-white transition-colors">
                                ${item.name}
                            </div>
                        </div>
                        <div class="font-semibold text-neonmint bg-neonmint/10 px-2 py-1 rounded-lg flex-shrink-0 border border-neonmint/20">
                            ${item.price.toLocaleString()} ฿
                        </div>
                    </div>
                `).join('');

                card.innerHTML = `
                    <div>
                        <!-- Card Header -->
                        <div class="flex items-start justify-between gap-3 pb-4 mb-3 border-b border-gray-800/80">
                            <div class="flex items-center gap-3">
                                <div class="w-10 h-10 rounded-2xl ${project.iconBg} flex items-center justify-center ${project.iconColor} text-lg flex-shrink-0 border border-white/5">
                                    <i class="fa-solid ${project.icon}"></i>
                                </div>
                                <div>
                                    <h3 class="font-bold text-base text-white group-hover:text-neonmint transition-colors line-clamp-1">
                                        ${project.title}
                                    </h3>
                                    <span class="text-[11px] text-gray-400">
                                        <i class="fa-solid fa-list-check mr-1 text-[10px]"></i> อุปกรณ์ ${project.items.length} รายการ
                                    </span>
                                </div>
                            </div>
                        </div>

                        <!-- Items List -->
                        <div class="space-y-0.5 my-2">
                            ${itemsHTML}
                        </div>
                    </div>

                    <!-- Card Footer / Total Price Highlight -->
                    <div class="mt-5 pt-3 border-t border-gray-800/80 flex items-center justify-between bg-darkbg/40 -mx-5 -mb-5 p-4 px-5 rounded-b-3xl">
                        <div class="text-xs text-gray-400 font-medium flex items-center gap-1.5">
                            <i class="fa-solid fa-calculator text-neonpink"></i>
                            <span>ราคารวมสุทธิ</span>
                        </div>
                        <div class="text-xl font-bold gradient-text-mint">
                            ${project.totalPrice.toLocaleString()} <span class="text-xs text-neonmint font-normal">บาท</span>
                        </div>
                    </div>
                `;

                grid.appendChild(card);
            });

            updateStats(projects.length, totalItemsCount, totalGrandCost);
        }

        // Update Stats Header
        function updateStats(projCount, itemsCount, totalCost) {
            document.getElementById('stat-projects-count').textContent = projCount;
            document.getElementById('stat-items-count').textContent = itemsCount;
        }

        // Filter & Search Logic
        function filterProjects() {
            const searchTerm = document.getElementById('search-input').value.trim().toLowerCase();
            const selectedFilter = document.getElementById('project-filter').value;
            const clearBtn = document.getElementById('clear-search');

            if (searchTerm !== '') {
                clearBtn.classList.remove('hidden');
            } else {
                clearBtn.classList.add('hidden');
            }

            const filtered = projectsData.filter(project => {
                // Match Select Filter
                const matchesSelect = (selectedFilter === 'all') || (project.id.toString() === selectedFilter);

                // Match Search Input (Project title or Item names)
                const matchesSearch = searchTerm === '' || 
                    project.title.toLowerCase().includes(searchTerm) ||
                    project.items.some(item => item.name.toLowerCase().includes(searchTerm) || item.category.toLowerCase().includes(searchTerm));

                return matchesSelect && matchesSearch;
            });

            renderDashboard(filtered);
        }

        // Reset All Filters
        function resetFilters() {
            document.getElementById('search-input').value = '';
            document.getElementById('project-filter').value = 'all';
            filterProjects();
        }

        // Event Listeners
        document.addEventListener('DOMContentLoaded', () => {
            initFilterOptions();
            renderDashboard(projectsData);

            document.getElementById('search-input').addEventListener('input', filterProjects);
            document.getElementById('project-filter').addEventListener('change', filterProjects);
            document.getElementById('reset-btn').addEventListener('click', resetFilters);
            document.getElementById('clear-search').addEventListener('click', () => {
                document.getElementById('search-input').value = '';
                filterProjects();
            });
        });
    </script>
</body>
</html>
